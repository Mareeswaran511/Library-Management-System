<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Update Book Request</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(to right,#dbeafe,#f3f4f6);
}

.header{
    background:#1e3a8a;
    color:white;
    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:50%;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#374151;
    font-weight:bold;
}

input[type="text"],
input[type="number"],
input[type="date"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input[type="text"]:focus,
input[type="number"]:focus,
input[type="date"]:focus{
    border-color:#1e3a8a;
    outline:none;
}

.info-note{
    font-size:13px;
    color:#6b7280;
    margin-top:4px;
}

.btn-submit{
    display:inline-block;
    padding:12px 20px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-submit:hover{
    background:#2563eb;
}

.btn-back{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#4b5563;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.btn-back:hover{
    background:#374151;
}

.button-container{
    text-align:center;
    margin-top:25px;
}
</style>
</head>

<body>

<div class="header">
Library Management System
</div>

<div class="container">

<h2>Update Book Request</h2>

<form action="UpdateBookRequest.jsp" method="POST">

<div class="form-group">
<label for="request_id">Target Request ID:</label>

<input type="number"
id="request_id"
name="request_id"
placeholder="Enter Request ID to update"
required>

<div class="info-note">
The exact ID number of the record you want to change.
</div>

</div>

<hr style="border:0; border-top:1px solid #e5e7eb; margin:25px 0;">

<p style="color:#1e3a8a; font-weight:bold; margin-bottom:15px;">
Enter New Details Below:
</p>

<div class="form-group">
<label for="book_title">New Book Title:</label>

<input type="text"
id="book_title"
name="book_title"
placeholder="Enter updated book title"
required
maxlength="100">
</div>

<div class="form-group">
<label for="member_id">New Member ID:</label>

<input type="text"
id="member_id"
name="member_id"
placeholder="Enter updated Member ID"
required
maxlength="10">
</div>

<div class="form-group">
<label for="request_date">New Request Date:</label>

<input type="date"
id="request_date"
name="request_date"
required>
</div>

<div class="button-container">
<button type="submit" class="btn-submit">
Update
</button>
</div>

</form>

<center>
<a href="../RequestPage.html" class="btn-back">
Back
</a>
</center>

</div>

</body>
</html>
