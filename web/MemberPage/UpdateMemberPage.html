<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Update Member</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(to right,#dbeafe,#f3f4f6);
}

.header{
background:#1e3a8a;
color:white;
text-align:center;
padding:20px;
font-size:30px;
font-weight:bold;
}

.container{
width:450px;
margin:60px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0px 5px 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#1e3a8a;
margin-bottom:25px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.btn{
width:150px;
padding:12px;
background:#1e3a8a;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.btn:hover{
background:#2563eb;
}

</style>

</head>

<body>

<div class="header">
Library Management System
</div>

<div class="container">

<h2>Update Member</h2>

<form action="UpdateMemberPage.jsp" method="post">

<div class="form-group">
<label>Member ID</label>
<input type="text" name="memberId" required>
</div>

<div class="form-group">
<label>Member Name</label>
<input type="text" name="memberName" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Phone</label>
<input type="text" name="phone" required>
</div>

<center>
<input type="submit" value="Update Member" class="btn">
</center>

</form>

</div>

</body>
</html>
