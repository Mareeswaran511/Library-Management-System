<!DOCTYPE html>
<html>
<head>
<title>Add Member</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(to right,#dbeafe,#f3f4f6);
}

.header{
background:#1e3a8a;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
width:450px;
margin:60px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0px 5px 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:25px;
color:#1e3a8a;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
}

.button-group{
display:flex;
gap:12px;
margin-top:20px;
}

.btn,
.back-btn{
flex:1;
height:48px;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
display:flex;
justify-content:center;
align-items:center;
}

.btn{
background:#1e3a8a;
color:white;
}

.btn:hover{
background:#2563eb;
}

.back-btn{
background:#6b7280;
color:white;
}

.back-btn:hover{
background:#4b5563;
}

</style>

</head>

<body>

<div class="header">
Library Management System
</div>

<div class="container">

<h2>Add Member</h2>

<form action="AddMemberPage.jsp" method="post">

<div class="input-group">
<label>Member Name</label>
<input type="text" name="membername" required>
</div>

<div class="input-group">
<label>Email ID</label>
<input type="email" name="email" required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="text" name="phone" required>
</div>

<div class="button-group">

<a href="../MemberPage.html" class="back-btn">
Back
</a>

<input type="submit" value="Add Member" class="btn">

</div>

</form>

</div>

</body>
</html>
