<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Search Member</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(to right, #dbeafe, #f3f4f6);
        }
        .header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 30px;
            font-weight: bold;
        }
        .container {
            width: 450px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0,0,0,.2);
            text-align: center;
        }
        h2 {
            color: #1e3a8a;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        input[type="submit"]:hover {
            background: #2563eb;
        }
        .btn-back {
            display: inline-block;
            margin-top: 15px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    Library Management System
</div>

<div class="container">
    <h2>Search Member</h2>
    
    <form action="SearchMemberPage.jsp" method="GET">
        <div class="form-group">
            <label for="searchId">Enter Member ID:</label>
            <input type="text" id="searchId" name="searchId" placeholder="e.g., 10002" required>
        </div>
        <input type="submit" value="Search Member">
    </form>
    
    <a href="../MemberPage.html" class="btn-back">Back to Menu</a>
</div>

</body>
</html>
