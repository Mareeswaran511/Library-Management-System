<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Search Feedback</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(to right,#dbeafe,#f3f4f6);
    margin:0;
}

.header{
    background:#1e3a8a;
    color:white;
    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:40%;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#1e3a8a;
}

label{
    font-weight:bold;
}

input[type="text"]{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
}

.btn{
    display:inline-block;
    padding:12px 20px;
    border:none;
    cursor:pointer;
    border-radius:8px;
    font-size:16px;
    color:white;
    text-decoration:none;
    margin:5px;
}

.btn-search{
    background:#1e3a8a;
}

.btn-search:hover{
    background:#2563eb;
}

.btn-back{
    background:#6b7280;
}

.btn-back:hover{
    background:#4b5563;
}

.button-group{
    text-align:center;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="header">Library Management System</div>

<div class="container">

<h2>Search Feedback</h2>

<form action="SearchFeedbackPage.jsp" method="post">

    <label>Feedback ID</label>
    <input type="text" name="feedback_id" required>

    <div class="button-group">
        <input type="submit" value="Search" class="btn btn-search">
        <a href="../FeedbackPage.html" class="btn btn-back">Back</a>
    </div>

</form>

</div>

</body>
</html>
