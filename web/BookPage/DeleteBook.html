<!DOCTYPE html>
<html>
<head>
<title>Delete Book</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(to right,#dbeafe,#f3f4f6);
}

.header{
background:#1e3a8a;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
width:450px;
margin:60px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0px 5px 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:25px;
color:#1e3a8a;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:20px;
}

.button-group{
display:flex;
gap:12px;
margin-top:20px;
}

.back-btn,.btn{
flex:1;
height:48px;
display:flex;
align-items:center;
justify-content:center;
border-radius:8px;
font-size:16px;
font-weight:bold;
}

.back-btn{
background:#6b7280;
color:white;
text-decoration:none;
}

.back-btn:hover{
background:#4b5563;
}

.btn{
background:#1e3a8a;
color:white;
border:none;
cursor:pointer;
}

.btn:hover{
background:#2563eb;
}

</style>

</head>

<body>

<div class="header">
Library Management System
</div>

<div class="container">

<h2>Delete Book</h2>

<form action="DeleteBook.jsp" method="post">

<label>Book ID</label>

<input type="number"
name="bookid"
placeholder="Enter Book ID"
required>

<div class="button-group">

<a href="../BookPage.html" class="back-btn">
Back
</a>

<input type="submit"
value="Delete Book"
class="btn">

</div>

</form>

</div>

</body>
</html>
