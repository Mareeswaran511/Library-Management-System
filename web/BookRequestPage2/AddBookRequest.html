<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add Book Request</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(to right,#dbeafe,#f3f4f6);
}

.header{
background:#1e3a8a;
color:white;
text-align:center;
padding:20px;
font-size:30px;
font-weight:bold;
}

.container{
width:50%;
margin:50px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

h2{
text-align:center;
color:#1e3a8a;
margin-bottom:20px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
color:#374151;
font-weight:bold;
}

input[type="text"],
input[type="date"]{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

input[type="text"]:focus,
input[type="date"]:focus{

border-color:#1e3a8a;
outline:none;
}

.button-container{

text-align:center;
margin-top:25px;
}

.btn-submit{

display:inline-block;
padding:12px 20px;
background:#1e3a8a;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.btn-submit:hover{

background:#2563eb;
}

.btn-back{

display:inline-block;
margin-top:20px;
padding:12px 20px;
background:#4b5563;
color:white;
text-decoration:none;
border-radius:8px;
}

.btn-back:hover{

background:#374151;
}

</style>
</head>

<body>

<div class="header">
Library Management System
</div>

<div class="container">

<h2>New Book Request</h2>

<form action="AddBookRequest.jsp" method="POST">

<div class="form-group">

<label>Book Title:</label>

<input type="text"
name="book_title"
placeholder="Enter Book Title"
required>

</div>

<div class="form-group">

<label>Member ID:</label>

<input type="text"
name="member_id"
placeholder="Enter Member ID (Ex: M101)"
required>

</div>

<div class="form-group">

<label>Request Date:</label>

<input type="date"
id="request_date"
name="request_date"
required>

</div>

<div class="button-container">

<button type="submit"
class="btn-submit">
Submit Request
</button>

</div>

</form>

<center>

<a href="../HomePage2.html"
class="btn-back">
Back
</a>

</center>

</div>

<script>

document.getElementById(
'request_date').valueAsDate=
new Date();

</script>

</body>
</html>
